server {
    listen 80;
    server_name _;
    # Docker service IPs can change when a container is rebuilt. Resolve them
    # continuously so a healthy redeploy cannot leave this gateway on a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway healthy\n";
    }

    location /api/ {
        set $lending_api http://backend:8000;
        proxy_pass $lending_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /service-unavailable.json;
    }

    location = /service-unavailable.json {
        internal;
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"detail":"Service temporarily unavailable. Your data is safe. Please try again in a few moments.","retry_after_seconds":30}';
    }

    location / {
        set $lending_frontend http://frontend:80;
        proxy_pass $lending_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
